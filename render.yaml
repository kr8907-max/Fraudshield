services:
  - type: web
    name: fraudshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Disables Swagger UI / ReDoc / OpenAPI schema on the deployed site
      # (interactive docs stay enabled in local development).
      - key: FRAUDSHIELD_ENV
        value: production
